name: Sync secrets to DB (app_secrets)

# Перекидає GH secrets (FB_ACCESS_TOKEN, IG_USER_ID) у Supabase-таблицю app_secrets
# (service-role-only), щоб Edge Functions могли читати токен, якого немає в Edge env.
# Значення маскуються GitHub-ом у логах. return=minimal → тіло відповіді порожнє.

on:
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Upsert secrets into app_secrets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SRK: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          FB_ACCESS_TOKEN: ${{ secrets.FB_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: |
          set +x
          BODY=$(jq -n --arg t "$FB_ACCESS_TOKEN" --arg ig "${IG_USER_ID:-17841403783002317}" \
            '[{key:"fb_access_token",value:$t},{key:"ig_user_id",value:$ig}]')
          code=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
            "$SUPABASE_URL/rest/v1/app_secrets?on_conflict=key" \
            -H "apikey: $SRK" -H "Authorization: Bearer $SRK" \
            -H "Content-Type: application/json" \
            -H "Prefer: resolution=merge-duplicates,return=minimal" \
            -d "$BODY")
          echo "HTTP $code"
          test "$code" = "201" -o "$code" = "204" -o "$code" = "200"
