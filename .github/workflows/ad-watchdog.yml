name: Ad Watchdog (Meta, read-only)

# Сторож реклами DreamCar: фаза 0 «Центру керування рекламою» (рішення 27.09.2026).
# ЛИШЕ ЧИТАННЯ Meta: тривоги в TG (оголошення з проблемами, 0 покупок при 1 500 ₴,
# перевитрата, бюджети понад стелю, кампанія не витрачає) + календар подій раз на день.
# Тихі години 23:00–07:00 Kyiv контролює скрипт (вночі лише перевитрата).
# Розклад зареєстровано повторно 28.09.2026: перші два слоти GitHub пропустив.

on:
  # 10.10.2026: розклад GitHub прибрано. Запускає pg_cron 10762 (:07 щогодини, workflow_dispatch);
  # подвійний тригер подвоював запити до Meta і впирався в ліміт (код 17).
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'DRY_RUN (1 = лише лог, без TG і без запису)'
        required: false
        default: '1'
        type: choice
        options: ['1', '0']

concurrency:
  group: ad-watchdog
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: etl/requirements.txt
      - name: Install deps
        run: pip install -r etl/requirements.txt
      - name: Run ad watchdog
        env:
          FB_ACCESS_TOKEN:           ${{ secrets.FB_ACCESS_TOKEN }}
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TG_BOT_TOKEN:              ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID:                ${{ secrets.TG_CHAT_ID }}
          DRY_RUN:                   ${{ github.event.inputs.dry_run || '0' }}
        run: python etl/ad_watchdog.py
