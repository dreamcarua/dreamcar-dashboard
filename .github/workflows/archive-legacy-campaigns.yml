name: Archive Legacy Campaigns
# Ховає з Ads Manager старі кампанії попередніх проєктів (created < cutoff, не ACTIVE, не DC|).
# Рекомендований порядок: спершу Legacy Hygiene (pause children), потім цей.
# ВАЖЛИВО: при масових помилках (rate-limit Meta) прогін падає, а не робить вигляд успіху.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'true = лише звіт, false = архівувати'
        required: true
        default: 'true'
      cutoff:
        description: 'Архівувати кампанії, створені ДО цієї дати (YYYY-MM-DD)'
        required: false
        default: '2026-01-01'
      fail_threshold:
        description: 'Доля помилок, вище якої прогін вважається невдалим (0.2 = 20%)'
        required: false
        default: '0.2'

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Archive legacy campaigns
        env:
          FB_ACCESS_TOKEN: ${{ secrets.FB_ACCESS_TOKEN }}
          AD_ACCOUNT_ID: '4136058269783354'
          DRY_RUN: ${{ inputs.dry_run }}
          CUTOFF: ${{ inputs.cutoff }}
          FAIL_THRESHOLD: ${{ inputs.fail_threshold }}
        run: python3 scripts/archive_legacy_campaigns.py
