name: New customers by ad (on demand)
on:
  workflow_dispatch:
    inputs:
      days:
        description: 'Скільки днів назад'
        required: false
        default: '3'
jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Run report
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python3 etl/new_customers_by_ad.py "${{ github.event.inputs.days }}"
