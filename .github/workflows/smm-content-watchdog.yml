name: SMM Content Watchdog (IG stories/posts)

# Моніторинг виходу контенту @dreamcar.ua.
# Алерти в TG-чат SMM: немає сторіз >3год, немає посту/рілз >24год.
# Тихі години 23:00–07:00 Kyiv контролюються всередині скрипта.

on:
  schedule:
    # 24.08.2026: було "*/30 * * * *" — але скрипт і так мовчить 23:00–07:00 Kyiv,
    # тобто третина ранів стартувала лише щоб нічого не зробити. GitHub округлює
    # білінг вгору по кожному job, тож холостий ран за 10 секунд коштує повну хвилину.
    # 4-20 UTC = 07:00–23:30 Kyiv — рівно робоче вікно скрипта.
    - cron: "*/30 4-20 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'DRY_RUN (1 = рахувати без відправки)'
        required: false
        default: '0'
        type: choice
        options: ['0', '1']

concurrency:
  group: smm-content-watchdog
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: etl/requirements.txt
      - name: Install deps
        run: pip install -r etl/requirements.txt
      - name: Run SMM content watchdog
        env:
          FB_ACCESS_TOKEN:           ${{ secrets.FB_ACCESS_TOKEN }}
          IG_USER_ID:                ${{ secrets.IG_USER_ID }}
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SMM_CHAT_ID:               "-1003933841573"
          DRY_RUN:                   ${{ github.event.inputs.dry_run || '0' }}
        run: python etl/smm_content_watchdog.py
