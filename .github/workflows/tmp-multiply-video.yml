name: tmp-multiply-video
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "true = only discovery, no creation"
        default: "true"
        required: true
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: multiply active video ads
        env:
          FB_TOKEN: ${{ secrets.FB_ACCESS_TOKEN }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          python3 - << 'PYEOF'
          import json, os, time, urllib.request, urllib.parse
          TOKEN = os.environ["FB_TOKEN"]; ACT = "act_4136058269783354"
          API = "https://graph.facebook.com/v21.0"
          CAMPS = ["120249698602830624","120249698605960624","120249698608790624","120249698612830624","120249980882600624"]
          def get(url):
              with urllib.request.urlopen(url) as r: return json.load(r)
          ads = []
          for c in CAMPS:
              url = f"{API}/{c}/ads?fields=id,name,effective_status,adset_id,creative{{id}}&limit=200&access_token={TOKEN}"
              while url:
                  d = get(url); ads += d.get("data", []); url = d.get("paging", {}).get("next")
          print("total ads fetched:", len(ads))
          act_video = [a for a in ads if "відео" in a["name"] and a["effective_status"] == "ACTIVE" and "creative" in a]
          creos = {}
          for a in act_video:
              base = a["name"].split(" – к")[0].strip()
              creos.setdefault(base, a["creative"]["id"])
          adsets = sorted({a["adset_id"] for a in ads if "iphone" in a["name"].lower()})
          print("ACTIVE video ads now:", len(act_video))
          print("Unique video creos:", json.dumps(creos, ensure_ascii=False, indent=1))
          print("Target adsets:", len(adsets), json.dumps(adsets))
          print("PLAN: create", len(adsets) * len(creos) * 2, "ads")
          if os.environ.get("DRY_RUN") == "true":
              print("DRY RUN — nothing created"); raise SystemExit(0)
          ok = 0; fail = 0
          for aset in adsets:
              for base, cid in creos.items():
                  for i in (1, 2):
                      params = urllib.parse.urlencode({
                          "name": f"{base} – к{i}",
                          "adset_id": aset,
                          "status": "ACTIVE",
                          "creative": json.dumps({"creative_id": cid}),
                          "access_token": TOKEN,
                      }).encode()
                      try:
                          req = urllib.request.Request(f"{API}/{ACT}/ads", data=params)
                          json.load(urllib.request.urlopen(req)); ok += 1
                      except Exception as e:
                          body = e.read().decode()[:300] if hasattr(e, "read") else str(e)
                          print("FAIL", aset, base, i, body); fail += 1
                      time.sleep(0.4)
          print(f"RESULT: CREATED {ok} FAILED {fail}")
          PYEOF
