name: Kill All Ads (sales cutoff)
on:
  # 08.08.2026 (аудит): schedule ЗНЯТО. Річний cron '58 20 2 8 *' відпрацював 02.08.2026
  # і лишався зарядженим на КОЖНЕ наступне 2 серпня — вимкнув би всю рекламу посеред
  # майбутнього циклу. Тепер тільки ручний запуск.
  workflow_dispatch:

jobs:
  kill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Pause all active campaigns
        env:
          FB_ACCESS_TOKEN: ${{ secrets.FB_ACCESS_TOKEN }}
          AD_ACCOUNT_ID: '4136058269783354'
        run: python3 scripts/kill_all_ads.py
