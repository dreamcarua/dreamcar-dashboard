name: kasa-debug
on:
  push: { paths: ['.github/workflows/kasa-debug.yml'] }
  workflow_dispatch:
permissions: { contents: write }
jobs:
  read:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env: { U: "${{ secrets.SUPABASE_URL }}", K: "${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" }
        run: |
          mkdir -p debug
          echo "=== TOTAL count ===" > debug/summary.txt
          curl -s -I "$U/rest/v1/kasa_transactions?select=id" -H "apikey: $K" -H "Authorization: Bearer $K" -H "Prefer: count=exact" | grep -i content-range >> debug/summary.txt
          echo "=== OUT count ===" >> debug/summary.txt
          curl -s -I "$U/rest/v1/kasa_transactions?select=id&direction=eq.out" -H "apikey: $K" -H "Authorization: Bearer $K" -H "Prefer: count=exact" | grep -i content-range >> debug/summary.txt
          echo "=== min/max occurred_at ===" >> debug/summary.txt
          curl -s "$U/rest/v1/kasa_transactions?select=occurred_at&order=occurred_at.asc&limit=1" -H "apikey: $K" -H "Authorization: Bearer $K" >> debug/summary.txt
          curl -s "$U/rest/v1/kasa_transactions?select=occurred_at&order=occurred_at.desc&limit=1" -H "apikey: $K" -H "Authorization: Bearer $K" >> debug/summary.txt
          curl -s "$U/rest/v1/kasa_accounts?select=id,name,kind,is_active" -H "apikey: $K" -H "Authorization: Bearer $K" > debug/accounts.json
          curl -s "$U/rest/v1/kasa_transactions?select=account_id,direction,amount_uah,occurred_at,description&direction=eq.out&order=occurred_at.desc&limit=5000" -H "apikey: $K" -H "Authorization: Bearer $K" > debug/out.json
          cat debug/summary.txt
      - run: |
          git config user.name bot; git config user.email bot@d.local
          git add debug/; git commit -m "state [skip ci-not]" || true; git push
