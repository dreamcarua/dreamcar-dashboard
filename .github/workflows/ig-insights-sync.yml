name: ETL Instagram Insights → Supabase (2x/day)

# Органіка Instagram (тренд підписників, охоплення, залученість, метрики постів)
# IG Graph API → dashboard_ig_account_daily / dashboard_ig_media.
# Той самий System User токен що FB Ads, але з IG-скоупами
# (instagram_basic, instagram_manage_insights, pages_read_engagement, pages_show_list).

on:
  schedule:
    - cron: "30 5,17 * * *"   # 08:30 та 20:30 Київ (EEST = UTC+3)
  workflow_dispatch:
    inputs:
      mode:
        description: 'Sync mode'
        required: true
        default: 'incremental'
        type: choice
        options: [incremental, initial, discover, range]
      since:
        description: 'Since YYYY-MM-DD (mode=range)'
        required: false
        default: ''
      until:
        description: 'Until YYYY-MM-DD (mode=range)'
        required: false
        default: ''

concurrency:
  group: etl-ig
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: etl/requirements.txt
      - name: Install deps
        run: pip install -r etl/requirements.txt
      - name: Run IG Insights ETL
        env:
          FB_ACCESS_TOKEN:           ${{ secrets.FB_ACCESS_TOKEN }}
          IG_USER_ID:                ${{ secrets.IG_USER_ID }}
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          MODE="${{ github.event.inputs.mode || 'incremental' }}"
          ARGS="--mode=$MODE"
          if [ -n "${{ github.event.inputs.since }}" ]; then ARGS="$ARGS --since=${{ github.event.inputs.since }}"; fi
          if [ -n "${{ github.event.inputs.until }}" ]; then ARGS="$ARGS --until=${{ github.event.inputs.until }}"; fi
          python etl/sync_ig_insights.py $ARGS
