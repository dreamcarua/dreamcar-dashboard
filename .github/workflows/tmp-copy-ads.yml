name: tmp-copy-ads
on:
  workflow_dispatch:
jobs:
  copy:
    runs-on: ubuntu-latest
    steps:
      - name: diagnose single copy
        env:
          TOKEN: ${{ secrets.FB_ACCESS_TOKEN }}
        run: |
          echo "=== T1: copies with status_option ==="
          curl -s -X POST "https://graph.facebook.com/v21.0/120250774758290624/copies" -d "adset_id=120249883647100624" -d "status_option=ACTIVE" -d "access_token=$TOKEN" | jq -c '.'
          echo "=== T2: copies bare ==="
          curl -s -X POST "https://graph.facebook.com/v21.0/120250774758290624/copies" -d "adset_id=120250384142630624" -d "access_token=$TOKEN" | jq -c '.'
          echo "=== T3: ad + adset info ==="
          curl -s "https://graph.facebook.com/v21.0/120250774758290624?fields=name,creative{id},tracking_specs&access_token=$TOKEN" | jq -c '{name:.name,creative:.creative.id}'
          curl -s "https://graph.facebook.com/v21.0/120249883647100624?fields=name,optimization_goal,destination_type,promoted_object&access_token=$TOKEN" | jq -c '.'
