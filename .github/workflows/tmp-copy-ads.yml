name: tmp-copy-ads
on:
  workflow_dispatch:
jobs:
  copy:
    runs-on: ubuntu-latest
    steps:
      - name: create iphone ads in DC02-05 via creative reuse
        env:
          TOKEN: ${{ secrets.FB_ACCESS_TOKEN }}
        run: |
          python3 - << 'PY'
          import json,os,time,urllib.request,urllib.parse
          tok=os.environ['TOKEN']
          base="https://graph.facebook.com/v21.0"
          ACT="act_4136058269783354"
          ads={"120250775561550624":"iphone 49 грн новий дизайн відео 3","120250775561560624":"iphone 49 грн новий дизайн відео 1","120250775499340624":"iphone 49 грн новий дизайн відео 2","120250775457770624":"iphone 49 грн старий дизайн відео 3","120250775427960624":"iphone 49 грн старий дизайн відео 2","120250775316810624":"iphone 49 грн старий дизайн відео 1","120250775249500624":"iphone 49 грн новий дизайн – копія – копія","120250775189970624":"iphone 49 грн новий дизайн – копія","120250774758290624":"iphone 49 грн старий дизайн","120250775146890624":"iphone 49 грн старий дизайн – копія – копія","120250775116120624":"iphone 49 грн старий дизайн – копія","120250775082420624":"iphone 49 грн новий дизайн"}
          adsets=["120249883647100624","120250384146330624","120250384145220624","120250384142630624","120249883739070624","120249883742020624","120250383367390624","120249980894940624","120249980891620624","120249980888590624"]
          def get(u):
              return json.load(urllib.request.urlopen(u))
          def post(u,params):
              data=urllib.parse.urlencode(params).encode()
              return json.load(urllib.request.urlopen(urllib.request.Request(u,data=data)))
          # step1: map ad -> creative_id
          cmap={}
          for ad in ads:
              try:
                  d=get(f"{base}/{ad}/adcreatives?fields=id,object_story_id,effective_object_story_id&access_token={tok}")
                  c=d["data"][0]
                  cmap[ad]={"cid":c["id"],"story":c.get("effective_object_story_id") or c.get("object_story_id")}
              except Exception as e:
                  print("MAP_ERR",ad,str(e)[:120])
          print("mapped:",len(cmap),"of",len(ads))
          # step2: test create with creative_id
          test_ad=list(cmap.keys())[0]
          mode="cid"
          try:
              r=post(f"{base}/{ACT}/ads",{"name":ads[test_ad],"adset_id":adsets[0],"status":"ACTIVE","creative":json.dumps({"creative_id":cmap[test_ad]["cid"]}),"access_token":tok})
              print("TEST cid mode OK:",r.get("id"))
              created_test=(test_ad,adsets[0])
          except urllib.error.HTTPError as e:
              err=json.loads(e.read())
              print("TEST cid mode FAIL:",json.dumps(err.get("error",{}))[:200])
              mode="story"; created_test=None
          if mode=="story":
              for ad in cmap:
                  try:
                      r=post(f"{base}/{ACT}/adcreatives",{"object_story_id":cmap[ad]["story"],"access_token":tok})
                      cmap[ad]["cid"]=r["id"]
                  except urllib.error.HTTPError as e:
                      print("CRE_ERR",ad,json.dumps(json.loads(e.read()).get("error",{}))[:150])
              print("fresh creatives done")
          # step3: batch create all
          total_ok=total_fail=0
          for aset in adsets:
              batch=[]
              for ad,info in cmap.items():
                  if created_test and (ad,aset)==created_test: continue
                  batch.append({"method":"POST","relative_url":f"{ACT}/ads","body":urllib.parse.urlencode({"name":ads[ad],"adset_id":aset,"status":"ACTIVE","creative":json.dumps({"creative_id":info["cid"]})})})
              data=urllib.parse.urlencode({"batch":json.dumps(batch),"access_token":tok}).encode()
              try:
                  r=json.load(urllib.request.urlopen(urllib.request.Request(base+"/",data=data)))
              except Exception as e:
                  print("BATCH_ERR",aset,str(e)[:120]); total_fail+=len(batch); continue
              ok=sum(1 for res in r if res and res.get("code")==200)
              fail=len(batch)-ok
              for res in r:
                  if res and res.get("code")!=200:
                      try: msg=json.loads(res["body"])["error"].get("error_user_title") or json.loads(res["body"])["error"]["message"]
                      except: msg=str(res)[:100]
                      print("FAIL",aset,msg[:120])
              total_ok+=ok; total_fail+=fail
              print(f"ADSET {aset}: ok={ok} fail={fail}")
              time.sleep(4)
          if created_test: total_ok+=1
          print(f"RESULT created_ok: {total_ok} failed: {total_fail}")
          PY
