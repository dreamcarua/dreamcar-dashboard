name: Launch 3phones (write)
# Одноразовий запуск проєкту "3 телефона": чистить 4 цільові адсети до 2 нових оголошень,
# розмножує їх, ставить бюджети ~35k/день, паузить sibling-адсети, активує 5 кампаній.
# Хардкоджені ID — без account-wide змін. dry_run=true = лише план.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'true = лише план (без записів), false = застосувати'
        default: 'true'
        required: true
jobs:
  launch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Launch 3phones
        env:
          FB_ACCESS_TOKEN: ${{ secrets.FB_ACCESS_TOKEN }}
          AD_ACCOUNT_ID: '4136058269783354'
          DRY_RUN: ${{ inputs.dry_run }}
        run: python3 scripts/launch_3phones.py
