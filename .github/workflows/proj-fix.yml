name: proj-fix
on:
  push: { paths: ['.github/workflows/proj-fix.yml'] }
  workflow_dispatch:
permissions: { contents: write }
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env: { U: "${{ secrets.SUPABASE_URL }}", K: "${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" }
        run: |
          mkdir -p debug
          echo "=== статуси угод BMW X6M (чому paid=0?) ===" > debug/f.txt
          curl -s "$U/rest/v1/dashboard_deals?select=status&project=eq.BMW%20X6M&limit=400" -H "apikey: $K" -H "Authorization: Bearer $K" | python3 -c "import json,sys,collections;print(collections.Counter(x['status'] for x in json.load(sys.stdin)))" >> debug/f.txt
          echo "=== SET deal_aliases=['BMW X6M'] для launch code=X6M ===" >> debug/f.txt
          curl -s -X PATCH "$U/rest/v1/launches?code=eq.X6M" -H "apikey: $K" -H "Authorization: Bearer $K" -H "Content-Type: application/json" -H "Prefer: return=representation" -d '{"deal_aliases":["BMW X6M"]}' | python3 -c "import json,sys;d=json.load(sys.stdin);print('updated:',[(x['name'][:20],x['deal_aliases']) for x in d])" >> debug/f.txt
          cat debug/f.txt
      - run: |
          git config user.name bot; git config user.email bot@d.local
          git add debug/; git commit -m "proj-fix state [skip ci-not]" || true; git push
