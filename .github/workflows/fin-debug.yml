name: fin-debug
on:
  push: { paths: ['.github/workflows/fin-debug.yml'] }
  workflow_dispatch:
permissions: { contents: write }
jobs:
  read:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env: { U: "${{ secrets.SUPABASE_URL }}", K: "${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" }
        run: |
          mkdir -p debug
          echo "=== 1) dashboard_period_pnl_v2 (09.07) ===" > debug/fin.txt
          curl -s -X POST "$U/rest/v1/rpc/dashboard_period_pnl_v2" -H "apikey: $K" -H "Authorization: Bearer $K" -H "Content-Type: application/json" -d '{"p_from":"2026-07-09","p_to":"2026-07-09","p_granularity":"day"}' >> debug/fin.txt
          echo "" >> debug/fin.txt
          echo "=== 2) dashboard_finance_overview (09.07) ===" >> debug/fin.txt
          curl -s -X POST "$U/rest/v1/rpc/dashboard_finance_overview" -H "apikey: $K" -H "Authorization: Bearer $K" -H "Content-Type: application/json" -d '{"p_from":"2026-07-09","p_to":"2026-07-09"}' >> debug/fin.txt
          echo "" >> debug/fin.txt
          echo "=== 3) gross paid deals 09.07 (sum amount) ===" >> debug/fin.txt
          curl -s "$U/rest/v1/dashboard_deals?select=amount,status,project,created_at&created_at=gte.2026-07-09&created_at=lt.2026-07-10&status=eq.paid" -H "apikey: $K" -H "Authorization: Bearer $K" > debug/deals.json
          python3 -c "import json;d=json.load(open('debug/deals.json'));print('paid deals:',len(d),'sum amount:',sum(float(x['amount'] or 0) for x in d))" >> debug/fin.txt
          cat debug/fin.txt
      - run: |
          git config user.name bot; git config user.email bot@d.local
          git add debug/; git commit -m "fin state [skip ci-not]" || true; git push
