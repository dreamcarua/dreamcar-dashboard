name: Audience Sync (Supabase -> Meta CA)
on:
  schedule:
    - cron: '30 3 * * *'   # щоночі 06:30 Kyiv
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'true = лише показати, false = створити/залити'
        required: false
        default: 'true'

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Sync audiences
        env:
          FB_ACCESS_TOKEN: ${{ secrets.FB_ACCESS_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: |
          pip install -q requests
          python3 etl/sync_audiences.py
