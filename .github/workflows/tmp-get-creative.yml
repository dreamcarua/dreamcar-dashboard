name: tmp-get-creative
on:
  workflow_dispatch:
    inputs:
      ad_id:
        required: true
        description: "Object ID"
      fields:
        required: false
        default: "id,name"
        description: "Graph fields"
jobs:
  get:
    runs-on: ubuntu-latest
    steps:
      - name: fetch object
        env:
          TOKEN: ${{ secrets.FB_ACCESS_TOKEN }}
          OBJ: ${{ github.event.inputs.ad_id }}
          F: ${{ github.event.inputs.fields }}
        run: |
          curl -s "https://graph.facebook.com/v21.0/${OBJ}?fields=${F}&access_token=$TOKEN" | jq -c '.'
