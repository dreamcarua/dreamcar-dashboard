name: ETL MySQL → Supabase

# Синкає MySQL `dreamcar_utm` (хостинг) → Supabase:
#   crm_deals   → dashboard_deals    (угоди SendPulse CRM)
#   webhook_log → dashboard_webhooks (сирі вебхуки трекера)
#   ads_data    → dashboard_ads_data (legacy-канал реклами)
#
# 🔴 ТРИГЕРИТЬСЯ З ДВОХ КАНАЛІВ — не міняй один, не глянувши на другий:
#   1) цей schedule
#   2) pg_cron job 75 → Edge `etl-trigger` → repository_dispatch, кожні 15 і 45 хв
# Основний канал — pg_cron (він надійний, на відміну від GH cron, який реально
# ходить у 2-4 рази рідше за розклад). Раніше тут стояло "0,30 * * * *", і разом
# із pg_cron виходило 96 тригерів на добу замість потрібних 48 — половина марно,
# бо кожен ран відпрацьовує 21 секунду, а білиться як повна хвилина.
#
# 24.08.2026: schedule лишається ЛИШЕ як резерв на випадок падіння Edge/pg_cron —
# 3 рази на добу, зі зсувом на :05, щоб не збігатися з pg_cron (:15/:45).
# Свіжість оплат від цього не страждає: основний канал працює як і працював.

on:
  schedule:
    - cron: "5 3,11,19 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: 'Sync mode'
        required: true
        default: 'incremental'
        type: choice
        options: [incremental, initial]
      only:
        description: 'Tables to sync'
        required: true
        default: 'all'
        type: choice
        options: [all, deals, webhooks, ads]
      limit:
        description: 'Limit rows (для тесту, порожнє = без обмежень)'
        required: false
        default: ''

concurrency:
  group: etl-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 35  # ~30 хв loop + buffer
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: etl/requirements.txt

      - name: Install deps
        run: pip install -r etl/requirements.txt

      - name: Run ETL loop (6 iterations × 5 min = ~30 min)
        env:
          MYSQL_HOST: ${{ secrets.MYSQL_HOST }}
          MYSQL_PORT: ${{ secrets.MYSQL_PORT }}
          MYSQL_DB:   ${{ secrets.MYSQL_DB }}
          MYSQL_USER: ${{ secrets.MYSQL_USER }}
          MYSQL_PASS: ${{ secrets.MYSQL_PASS }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          MODE="${{ github.event.inputs.mode || 'incremental' }}"
          ONLY="${{ github.event.inputs.only || 'all' }}"
          LIMIT_ARG=""
          if [ -n "${{ github.event.inputs.limit }}" ]; then
            LIMIT_ARG="--limit=${{ github.event.inputs.limit }}"
          fi
          # 08.08.2026 (аудит): внутрішній loop 6×5хв ПРИБРАНО. Джоб тривав ~27 хв при
          # тригерах кожні 5-15 хв (cron + pg_net dispatch) → черга росла, GitHub скасовував
          # хвіст (~12 cancelled/год = шторм fail-листів) + ~40 000 idle-хвилин/міс білінгу.
          # Тепер один прохід ~2 хв; каденс задають cron 0,30 + pg_cron :15,:45 = кожні 15 хв.
          python etl/sync_mysql_to_supabase.py --mode="$MODE" --only="$ONLY" $LIMIT_ARG
          echo "✅ Done"
